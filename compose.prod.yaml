services:
  nginx:
    image: ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    labels:
      - traefik.http.routers.front-nginx.rule=Host(`tower-empire.org`)
      - traefik.http.routers.front-nginx.entrypoints=https
      - traefik.http.routers.front-nginx.tls=true
      - traefik.http.routers.front-nginx.tls.certresolver=letsencrypt
      - traefik.http.services.front-nginx.loadbalancer.server.port=80
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
