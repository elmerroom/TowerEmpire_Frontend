server {
    listen 80;
    server_name localhost;

    # Путь к статическим файлам вашего приложения
    root /usr/share/nginx/html;

    # Файл, который будет использоваться по умолчанию
    index index.html;

    # Главная логика для SPA
    location / {
        # Пытаемся найти файл, соответствующий запросу ($uri).
        # Если не нашли, пытаемся найти папку ($uri/).
        # Если и её не нашли, то отдаём /index.html.
        # Это позволяет React/Vue/Angular Router'у обработать маршрут.
        try_files $uri $uri/ /index.html;
    }

    # # Дополнительно: можно настроить кэширование для статики (CSS, JS, картинки)
    # # чтобы ускорить загрузку при повторных посещениях.
    # location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    #     expires 1M;
    #     add_header Cache-Control "public";
    # }
}